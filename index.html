<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f4" />
    <meta
      name="description"
      content="Conheça o JigSolver: visão computacional para apoiar a montagem de quebra-cabeças físicos. Um protótipo de pesquisa em Ciência da Computação."
    />
    <meta
      property="og:title"
      content="JigSolver — Uma nova perspectiva para cada peça"
    />
    <meta
      property="og:description"
      content="Explore as experiências de captura, análise e reconstrução de quebra-cabeças."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>JigSolver — Uma nova perspectiva para cada peça</title>
    <script>
      try {
        const t = localStorage.getItem("jigsolver-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
